server:
  port: 8082

spring:
  application:
    name: ms-gymflow-catalog
  # Amazon RDS PostgreSQL. Nada de secretos aquí: todo llega por variables de entorno (.env en la EC2).
  #  - DB_URL: jdbc:postgresql://<endpoint-rds>:5432/gymflow?sslmode=require
  #  - DB_USERNAME y DB_PASSWORD: credenciales de la instancia (la contraseña solo en el .env de la EC2)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    # Las entidades no se exponen fuera de la transacción: los servicios devuelven DTO.
    open-in-view: false
    hibernate:
      # "update" crea las tablas la primera vez. Se puede pasar a "validate" con JPA_DDL_AUTO una vez creado el esquema.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
